  <circle cx="50" cy="50" r="50" fill="#e6f3df"/>
  <g>
    <!-- 少しめくれた外葉（左に1枚だけ、非対称にすることで花っぽさを消す） -->
    <path d="M22 45 Q14 34 24 26 Q34 30 32 44 Q27 46 22 45 Z" fill="#6a9c47"/>
    <!-- 玉本体（丸くつまった球） -->
