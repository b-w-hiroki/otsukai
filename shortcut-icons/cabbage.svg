    <path d="M28 50 Q45 58 52 50" stroke="#6a9c47" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M30 64 Q50 74 74 62" stroke="#6a9c47" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M50 40 Q65 46 72 58" stroke="#6a9c47" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- ハイライト -->
    <ellipse cx="40" cy="46" rx="10" ry="7" fill="#dcedc0" opacity="0.6"/>
  </g>
</svg>
