name: check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JS 構文チェック（単体ファイル）
        run: |
          for f in app-*.js news.js sw.js firebase-messaging-sw.js firebase-config.js functions/*.js; do
            node --check "$f"
          done

      - name: HTML インラインスクリプトの構文チェック（app.html / index.html / contact.html）
        run: |
          node -e '
            const fs = require("fs");
            let errors = 0;
            for (const file of ["app.html", "index.html", "contact.html", "news.html", "news-item.html"]) {
              const html = fs.readFileSync(file, "utf8");
              const re = /<script([^>]*)>([\s\S]*?)<\/script>/gi;
              let m, count = 0;
              while ((m = re.exec(html))) {
                if (/\bsrc\s*=/.test(m[1]) || /\btype\s*=\s*"application\/ld\+json"/.test(m[1])) continue;
                count++;
                try { new Function(m[2]); }
                catch (e) { errors++; console.error(file + " script #" + count + ": " + e.message); }
              }
              console.log(file + ": inline scripts " + count);
            }
            if (errors > 0) process.exit(1);
          '

      - name: JSON 妥当性チェック
        run: |
          node -e '
            const fs = require("fs");
            for (const f of ["manifest.json", "database.rules.json", "firebase.json", ".firebaserc", "functions/package.json"]) {
              JSON.parse(fs.readFileSync(f, "utf8"));
              console.log(f + " OK");
            }
          '

      - name: sw.js のプリキャッシュ対象が存在するか
        run: |
          node -e '
            const fs = require("fs");
            const sw = fs.readFileSync("sw.js", "utf8");
            const missing = [...sw.matchAll(/"\.\/([^"]+)"/g)]
              .map((m) => m[1])
              .filter((p) => !fs.existsSync(p));
            if (missing.length) {
              console.error("missing precache files:", missing);
              process.exit(1);
            }
            console.log("precache files all exist");
          '

      - name: 検索公開範囲とメタ情報
        run: node tests/search-discovery.mjs

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ドキュメント整合性（リンク・二重管理・正本レジストリ）
        run: node tests/docs-check.mjs

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright をインストール
        run: |
          npm init -y > /dev/null
          npm i playwright > /dev/null
          npx playwright install --with-deps chromium
      - name: スモークテスト（起動＋認証画面表示＋未捕捉エラーゼロ）
        run: node tests/smoke.mjs

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright をインストール
        run: |
          npm init -y > /dev/null
          npm i playwright > /dev/null
          npx playwright install --with-deps chromium
      - name: 回帰スイート（インメモリ Firebase スタブで主要導線を通す）
        run: node tests/run-all.mjs

  security_rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Invitation expiry and reuse
        run: node --test tests/security/invite-test.mjs
      - name: Install local emulator test dependencies
        run: |
          npm init -y > /dev/null
          npm install --no-save firebase-tools @firebase/rules-unit-testing firebase
      - name: Test RTDB rules against synthetic demo data
        run: npx firebase emulators:exec --project demo-otsukai-authz --config tests/security/firebase.json --only database "node tests/security/rules-test.mjs"
