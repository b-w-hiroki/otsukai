<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>お問い合わせ — おうちのおつかい</title>
  <meta name="description" content="おうちのおつかい（家族向けおつかい共有アプリ）へのお問い合わせフォーム" />
  <meta name="theme-color" content="#6366f1" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <style>
    :root { --ink:#1c1917; --muted:#78716c; --border:#e7e5e1; --pri:#6366f1; --bg:#faf9f7; --surface:#fff; --danger:#dc2626; }
    @media (prefers-color-scheme: dark) {
      :root { --ink:#f5f4f2; --muted:#a8a29e; --border:#35323f; --pri:#a5b4fc; --bg:#14131a; --surface:#1e1d26; --danger:#f87171; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0 20px 110px;
      font-family: system-ui, -apple-system, 'Hiragino Kaku Gothic ProN', sans-serif;
      color: var(--ink); background: var(--bg); line-height: 1.9;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    header { padding: 40px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
    h1 { font-size: 24px; margin: 0 0 8px; letter-spacing: -0.4px; }
    p { font-size: 15px; }
    .muted { color: var(--muted); font-size: 13px; }
    a { color: var(--pri); }
    footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border); }

    .field { margin-bottom: 22px; }
    label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
    label .opt { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 4px; }
    input, select, textarea {
      width: 100%; min-height: 44px; padding: 11px 14px;
      border: 1.5px solid var(--border); border-radius: 12px;
      background: var(--surface); color: var(--ink);
      font-size: 15px; font-family: inherit; line-height: 1.5;
    }
    textarea { min-height: 160px; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--pri); }

    #btn-submit {
      display: block; width: 100%; min-height: 48px; padding: 0 24px;
      background: linear-gradient(135deg, var(--pri) 0%, #4f46e5 100%);
      color: #fff; font-weight: 700; font-size: 15px;
      border: none; border-radius: 999px; cursor: pointer;
      box-shadow: 0 4px 18px rgba(99,102,241,0.4);
    }
    #btn-submit:active { transform: scale(0.98); }

    #form-error {
      display: none; color: var(--danger); font-size: 13px; font-weight: 700;
      margin: -8px 0 20px;
    }

    .box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; margin: 20px 0; font-size: 13px; color: var(--muted); }

    .back-float {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 44px; padding: 0 24px;
      background: linear-gradient(135deg, var(--pri) 0%, #4f46e5 100%);
      color: #fff; font-weight: 700; font-size: 14px; line-height: 1;
      border-radius: 999px; text-decoration: none; white-space: nowrap;
      box-shadow: 0 4px 18px rgba(99,102,241,0.4);
      z-index: 50; -webkit-tap-highlight-color: transparent;
    }
    .back-float:active { transform: translateX(-50%) scale(0.96); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>✉️ おうちのおつかい — お問い合わせ</h1>
      <p class="muted">不具合の報告・機能のご要望・その他ご質問など、お気軽にどうぞ。</p>
    </header>

    <p class="muted">
      送信ボタンを押すと、入力内容を差し込んだ状態でお使いのメールアプリが開きます。
      内容をご確認のうえ、そのまま送信してください。
    </p>

    <form id="contact-form">
      <div class="field">
        <label for="c-name">お名前<span class="opt">（任意）</span></label>
        <input type="text" id="c-name" autocomplete="name" placeholder="やまだ たろう" />
      </div>

      <div class="field">
        <label for="c-type">お問い合わせの種類</label>
        <select id="c-type">
          <option value="不具合の報告">不具合の報告</option>
          <option value="機能のご要望">機能のご要望</option>
          <option value="その他のご質問">その他のご質問</option>
        </select>
      </div>

      <div class="field">
        <label for="c-reply">ご返信用メールアドレス<span class="opt">（任意）</span></label>
        <input type="email" id="c-reply" autocomplete="email" placeholder="reply@example.com" />
      </div>

      <div class="field">
        <label for="c-body">お問い合わせ内容</label>
        <textarea id="c-body" placeholder="できるだけ詳しく教えてください（不具合の場合は、いつ・どの画面で・何をしたら起きたか など）"></textarea>
      </div>

      <p id="form-error">お問い合わせ内容を入力してください</p>

      <button type="submit" id="btn-submit">メールアプリで送信する</button>
    </form>

    <div class="box">
      メールアプリが開かない場合は、
      <a href="mailto:hiroki.torii4649@gmail.com">hiroki.torii4649@gmail.com</a>
      まで直接ご連絡ください。
    </div>

    <footer>
      <p class="muted">
        <a href="./">← おうちのおつかいに戻る</a> ・
        <a href="./guide.html">使い方ガイド</a>
      </p>
    </footer>
  </div>
  <a href="./" class="back-float">← アプリに戻る</a>

  <script>
    document.getElementById("contact-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var body = document.getElementById("c-body").value.trim();
      var errorEl = document.getElementById("form-error");
      if (!body) {
        errorEl.style.display = "block";
        return;
      }
      errorEl.style.display = "none";

      var name = document.getElementById("c-name").value.trim();
      var type = document.getElementById("c-type").value;
      var reply = document.getElementById("c-reply").value.trim();

      var lines = [];
      if (name) lines.push("お名前: " + name);
      if (reply) lines.push("返信用メールアドレス: " + reply);
      if (lines.length) lines.push("");
      lines.push(body);

      var subject = "【おうちのおつかい】" + type;
      var mailto = "mailto:hiroki.torii4649@gmail.com"
        + "?subject=" + encodeURIComponent(subject)
        + "&body=" + encodeURIComponent(lines.join("\n"));
      window.location.href = mailto;
    });
  </script>
</body>
</html>
