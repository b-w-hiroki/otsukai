<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>お問い合わせ — おうちのおつかい</title>
  <meta name="description" content="おうちのおつかい（家族向けおつかい共有アプリ）へのお問い合わせフォーム" />
  <meta name="theme-color" content="#6366f1" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <style>
    /* --muted は注釈用。terms/privacy より一段濃くして、フォームの説明文が読めるようにしている */
    :root { --ink:#1c1917; --muted:#57534e; --border:#e7e5e1; --pri:#6366f1; --bg:#faf9f7; --surface:#fff; --danger:#dc2626; }
    @media (prefers-color-scheme: dark) {
      :root { --ink:#f5f4f2; --muted:#c4bfb8; --border:#35323f; --pri:#a5b4fc; --bg:#14131a; --surface:#1e1d26; --danger:#f87171; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0 20px 110px;
      font-family: system-ui, -apple-system, 'Hiragino Kaku Gothic ProN', sans-serif;
      color: var(--ink); background: var(--bg); line-height: 1.9;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    header { padding: 40px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
    h1 { font-size: 24px; margin: 0 0 8px; letter-spacing: -0.4px; }
    p { font-size: 15px; }
    .muted { color: var(--muted); font-size: 14.5px; line-height: 1.8; }
    a { color: var(--pri); }
    footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border); }

    .field { margin-bottom: 22px; }
    label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
    label .opt { font-weight: 500; color: var(--muted); font-size: 13px; margin-left: 4px; }
    label .req { font-weight: 700; color: var(--danger); font-size: 12px; margin-left: 4px; }
    input, textarea {
      width: 100%; min-height: 44px; padding: 11px 14px;
      border: 1.5px solid var(--border); border-radius: 12px;
      background: var(--surface); color: var(--ink);
      font-size: 15px; font-family: inherit; line-height: 1.5;
    }
    textarea { min-height: 160px; resize: vertical; }
    input:focus, textarea:focus { outline: none; border-color: var(--pri); }

    .agree {
      display: flex; align-items: flex-start; gap: 10px;
      min-height: 44px; margin: 4px 0 22px; cursor: pointer;
      font-size: 14px; font-weight: 400; line-height: 1.7;
    }
    .agree input[type="checkbox"] { width: 20px; height: 20px; min-height: 0; margin-top: 4px; padding: 0; flex-shrink: 0; }

    #btn-submit {
      display: block; width: 100%; min-height: 48px; padding: 0 24px;
      background: linear-gradient(135deg, var(--pri) 0%, #4f46e5 100%);
      color: #fff; font-weight: 700; font-size: 15px;
      border: none; border-radius: 999px; cursor: pointer;
      box-shadow: 0 4px 18px rgba(99,102,241,0.4);
    }
    #btn-submit:active { transform: scale(0.98); }
    #btn-submit:disabled { opacity: 0.6; cursor: default; box-shadow: none; }

    #form-error {
      display: none; color: var(--danger); font-size: 13px; font-weight: 700;
      margin: -8px 0 20px;
    }
    #form-status {
      display: none; font-size: 14px; font-weight: 700; margin: -8px 0 20px;
      padding: 12px 14px; border-radius: 12px;
    }
    #form-status.sending { display: block; color: var(--muted); background: var(--surface); border: 1.5px solid var(--border); }
    #form-status.success { display: block; color: #16a34a; background: rgba(22,163,74,0.1); }
    #form-status.error { display: block; color: var(--danger); background: rgba(220,38,38,0.1); }

    .box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; margin: 20px 0; font-size: 14.5px; line-height: 1.8; color: var(--ink); }

    .back-float {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 44px; padding: 0 24px;
      background: linear-gradient(135deg, var(--pri) 0%, #4f46e5 100%);
      color: #fff; font-weight: 700; font-size: 14px; line-height: 1;
      border-radius: 999px; text-decoration: none; white-space: nowrap;
      box-shadow: 0 4px 18px rgba(99,102,241,0.4);
      z-index: 50; -webkit-tap-highlight-color: transparent;
    }
    .back-float:active { transform: translateX(-50%) scale(0.96); }
    /* ログイン画面からの遷移（?from=auth）では出さない（JSでこのクラスを付ける） */
    .back-float.is-hidden { display: none; }
    /* PC（広い画面）では固定ボタンは不要。フッターのリンクだけにする */
    @media (min-width: 768px) {
      .back-float { display: none; }
      body { padding-bottom: 40px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>✉️ おうちのおつかい — お問い合わせ</h1>
      <p class="muted">不具合の報告・機能のご要望・その他ご質問など、お気軽にどうぞ。</p>
    </header>

    <p class="muted">
      このフォームから送信すると、開発者宛てに直接メールが届きます。<span style="color:var(--danger);font-weight:700;">*</span> は必須項目です。
    </p>

    <form id="contact-form" novalidate>
      <div class="field">
        <label for="c-name">お名前<span class="req">*</span></label>
        <input type="text" id="c-name" autocomplete="name" placeholder="やまだ たろう" />
      </div>

      <div class="field">
        <label for="c-company">会社名・組織名<span class="opt">（任意）</span></label>
        <input type="text" id="c-company" autocomplete="organization" placeholder="株式会社〇〇 / 〇〇小学校 PTA / 個人 など" />
      </div>

      <div class="field">
        <label for="c-email">メールアドレス<span class="req">*</span></label>
        <input type="email" id="c-email" autocomplete="email" inputmode="email" placeholder="example@example.com" />
      </div>

      <div class="field">
        <label for="c-phone">電話番号<span class="opt">（任意）</span></label>
        <input type="tel" id="c-phone" autocomplete="tel" inputmode="tel" placeholder="090-1234-5678" />
      </div>

      <div class="field">
        <label for="c-subject">件名<span class="req">*</span></label>
        <input type="text" id="c-subject" placeholder="例: ログインできない / 機能の要望 など" />
      </div>

      <div class="field">
        <label for="c-body">お問い合わせ内容<span class="req">*</span></label>
        <textarea id="c-body" placeholder="できるだけ詳しく教えてください（不具合の場合は、いつ・どの画面で・何をしたら起きたか など）"></textarea>
      </div>

      <!-- スパム対策のハニーポット。人には見えない/フォーカスされない項目で、
           ここが埋まっていたら機械的な送信とみなして黙って無視する（送信元には
           成功したように見せておく）。スクリーンリーダーからも隠す -->
      <div aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;">
        <input type="text" id="c-hp" name="website" tabindex="-1" autocomplete="off" />
      </div>

      <label class="agree" for="c-agree">
        <input type="checkbox" id="c-agree" />
        <span><a href="./privacy.html" target="_blank" rel="noopener">プライバシーポリシー</a>に同意します<span class="req">*</span></span>
      </label>

      <p id="form-error"></p>
      <p id="form-status"></p>

      <button type="submit" id="btn-submit" disabled>送信する</button>
    </form>

    <div class="box" id="fallback-box">
      うまく送信できない場合は、
      <a href="mailto:hiroki.torii4649@gmail.com">hiroki.torii4649@gmail.com</a>
      まで直接ご連絡ください。
    </div>

    <footer>
      <p class="muted">
        <a href="./guide.html">使い方ガイド</a> ・
        <a href="./privacy.html">プライバシーポリシー</a>
      </p>
    </footer>
  </div>
  <a href="./" class="back-float">← アプリに戻る</a>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
  <script src="./firebase-config.js"></script>
  <script>
    // ログイン画面（index.html の #screen-auth）からは別タブで開かれ、元のタブに
    // アプリが残っているので「アプリに戻る」は出さない
    if (new URLSearchParams(location.search).get("from") === "auth") {
      var backFloat = document.querySelector(".back-float");
      if (backFloat) backFloat.classList.add("is-hidden");
    }

    // Firebase SDK の初期化は送信時まで遅らせる。SDK が読み込めない環境（オフライン・
    // 広告ブロッカー等）でもフォーム自体（同意チェック→ボタン有効化、入力チェック）は
    // 動かし、送信時に初めて「送信できない」と案内する
    function getSubmitFn() {
      if (typeof firebase === "undefined") throw new Error("Firebase SDK が読み込めませんでした");
      if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      return firebase.app().functions("asia-southeast1").httpsCallable("submitContactForm");
    }

    var form = document.getElementById("contact-form");
    var btn = document.getElementById("btn-submit");
    var agree = document.getElementById("c-agree");
    var errorEl = document.getElementById("form-error");
    var statusEl = document.getElementById("form-status");

    function val(id) { return document.getElementById(id).value.trim(); }
    function showError(msg) { errorEl.textContent = msg; errorEl.style.display = msg ? "block" : "none"; }
    function setStatus(kind, text) {
      statusEl.className = kind || "";
      statusEl.textContent = text || "";
      statusEl.style.display = text ? "block" : "none";
    }

    // 同意チェックが無いと送信ボタンを押せない（ログイン画面の新規登録と同じ考え方）
    agree.addEventListener("change", function () { btn.disabled = !agree.checked; });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      showError("");
      setStatus("", "");

      var name = val("c-name");
      var company = val("c-company");
      var email = val("c-email");
      var phone = val("c-phone");
      var subject = val("c-subject");
      var body = val("c-body");
      var honeypot = document.getElementById("c-hp").value;

      if (!name) return showError("お名前を入力してください");
      if (!email) return showError("メールアドレスを入力してください");
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError("メールアドレスの形式が正しくありません");
      if (!subject) return showError("件名を入力してください");
      if (!body) return showError("お問い合わせ内容を入力してください");
      // ボタンは無効化しているが、Enterキー経由でも通る入口なので二重に確認する
      if (!agree.checked) return showError("プライバシーポリシーへの同意が必要です");

      // ハニーポットが埋まっている＝機械的な送信。実際には送らず、
      // 相手には成功したように見せておく（学習させて回避されるのを防ぐ）
      if (honeypot) {
        setStatus("success", "✅ 送信しました。ご連絡ありがとうございます。");
        form.reset();
        btn.disabled = true;
        return;
      }

      var submitFn;
      try { submitFn = getSubmitFn(); }
      catch (err) {
        console.error("Firebase SDK unavailable", err);
        setStatus("error", "⚠️ 送信機能を読み込めませんでした。通信環境をご確認いただくか、下のメールアドレスへ直接ご連絡ください。");
        return;
      }

      btn.disabled = true;
      setStatus("sending", "送信しています…");

      submitFn({ name: name, company: company, email: email, phone: phone, subject: subject, message: body, agreed: true, hp: honeypot })
        .then(function () {
          setStatus("success", "✅ 送信しました。ご連絡ありがとうございます。");
          form.reset();
          btn.disabled = true; // reset で同意チェックも外れるので、ボタンも無効に戻す
        })
        .catch(function (err) {
          console.error("submitContactForm failed", err);
          setStatus("error", "⚠️ 送信に失敗しました。お手数ですが下のメールアドレスへ直接ご連絡ください。");
          btn.disabled = false;
        });
    });
  </script>
</body>
</html>
