<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>お知らせ — おうちのおつかい</title>
  <meta name="description" content="おうちのおつかい（家族向け買い物リスト共有アプリ）のお知らせ一覧。アップデートの履歴を日付順に載せています。" />
  <meta name="theme-color" content="#6366f1" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" />
  <style>
    /* 配色はアプリ本体（styles.css の :root）と同じトークン名・値に合わせる。news-item.html と共通 */
    :root {
      --bg:#faf9f7; --surface:#ffffff; --surface-2:#f4f3f0;
      --ink:#1c1917; --ink-2:#44403c; --muted:#8a847c; --border:#e7e5e1;
      --pri:#6366f1; --pri-soft:#eeecfb; --pri-ink:#4f46e5;
      --fix:#b91c1c; --fix-soft:#fff1f2;
      --improve:#b45309; --improve-soft:#fffbeb;
      --new:#047857; --new-soft:#ecfdf5;
      --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.07);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:#16140f; --surface:#211e19; --surface-2:#2a2621;
        --ink:#f4f1ec; --ink-2:#d6d0c8; --muted:#8f887f; --border:#38332c;
        --pri:#8b8cf7; --pri-soft:#2a2952; --pri-ink:#b4b3ff;
        --fix:#fca5a5; --fix-soft:#3a2224;
        --improve:#fcd34d; --improve-soft:#3a2f14;
        --new:#6ee7b7; --new-soft:#12302a;
        --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: 'Noto Sans JP', system-ui, -apple-system, 'Hiragino Kaku Gothic ProN', sans-serif;
      font-size: 15px; line-height: 1.85; -webkit-font-smoothing: antialiased;
      padding-bottom: 96px;
    }
    .maru { font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Noto Sans JP', sans-serif; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 36px 20px 40px; }
    header { margin-bottom: 22px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--pri-ink); background: var(--pri-soft); padding: 4px 12px; border-radius: 999px; }
    h1 { font-size: 26px; line-height: 1.35; margin: 14px 0 8px; text-wrap: balance; letter-spacing: -.01em; }
    .lead { margin: 0; color: var(--ink-2); max-width: 40em; }

    /* 一覧: 1更新 = 1行。タップで記事（news-item.html）へ */
    .list { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; }
    a.entry {
      display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
      padding: 16px 18px; min-height: 44px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow);
      color: inherit; text-decoration: none;
    }
    a.entry:hover { border-color: var(--pri); }
    a.entry:focus-visible { outline: 2px solid var(--pri); outline-offset: 2px; }
    .date { font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 700; color: var(--pri-ink); background: var(--pri-soft); padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
    .entry-main { min-width: 0; }
    .entry-title { margin: 0; font-size: 16.5px; line-height: 1.5; text-wrap: balance; }
    .entry-lead { margin: 4px 0 0; font-size: 13px; color: var(--muted); line-height: 1.6; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .entry-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 2px 9px; border-radius: 999px; }
    .tag.fix { color: var(--fix); background: var(--fix-soft); }
    .tag.improve { color: var(--improve); background: var(--improve-soft); }
    .tag.new { color: var(--new); background: var(--new-soft); }
    .entry-meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .entry-meta .arrow { color: var(--pri); font-weight: 700; margin-left: 6px; }
    .empty { text-align: center; color: var(--muted); padding: 40px 20px; }

    footer { margin-top: 28px; padding: 16px 20px; border-radius: 16px; background: var(--pri-soft); color: var(--ink-2); font-size: 13.5px; }
    footer b { color: var(--pri-ink); }
    footer p { margin: 6px 0; }
    /* 外部からこのページだけ開いたときに迷わないよう、常に見える「戻る」を置く（guide.html と同じ） */
    .back-float {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 44px; padding: 0 24px;
      background: linear-gradient(135deg, var(--pri) 0%, #4f46e5 100%);
      color: #fff; font-weight: 700; font-size: 14px; line-height: 1;
      border-radius: 999px; text-decoration: none; white-space: nowrap;
      box-shadow: 0 4px 18px rgba(99,102,241,0.4); z-index: 50;
    }
    @media (max-width: 640px) {
      /* スマホでは日付を上に置いて1列に（横並びだと日付ピルが縦の真ん中に浮いて見える） */
      a.entry { grid-template-columns: 1fr; gap: 8px; }
      .date { justify-self: start; }
      .entry-meta { text-align: right; }
      h1 { font-size: 23px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="eyebrow">📣 お知らせ</span>
      <h1 class="maru">アップデート履歴</h1>
      <p class="lead">みなさんからいただいた声と、それをどう直したかを、更新ごとにまとめています。新しいものが上に来ます。タップすると詳しい内容が開きます。</p>
    </header>
    <main id="list" class="list" aria-live="polite"></main>
    <footer>
      <p><b>更新の反映について</b></p>
      <p>アプリを開き直すと「新しいバージョンがあります」と出るので、<b>「更新する」</b>を押してください。出ない場合は、設定タブ → 🔧メンテナンス →「更新を確認」から反映できます。</p>
    </footer>
  </div>
  <a class="back-float" href="./app.html">🧺 アプリに戻る</a>

  <script src="./news.js"></script>
  <script>
    // news.js の NEWS を日付の新しい順に並べ、1更新 = 1行のリンクとして描く。
    // 記事本文は news-item.html?id=<id> に分けてある（一覧は日付とタイトルで見渡す用途）。
    (function () {
      var esc = function (s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      };
      var fmtDate = function (iso) {
        var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
        return m ? Number(m[1]) + "年" + Number(m[2]) + "月" + Number(m[3]) + "日" : esc(iso);
      };
      var KIND_LABEL = { fix: "不具合修正", improve: "改善", new: "新機能" };
      var root = document.getElementById("list");
      var list = (typeof NEWS !== "undefined" && Array.isArray(NEWS) ? NEWS.slice() : [])
        .sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
      if (!list.length) {
        root.innerHTML = '<p class="empty">まだお知らせはありません。</p>';
        return;
      }
      root.innerHTML = list.map(function (u) {
        var items = u.items || [];
        // 種類ごとの件数をタグで（不具合修正 2 ・ 改善 5 ・ 新機能 2 のように）
        var counts = {};
        items.forEach(function (it) { var k = KIND_LABEL[it.kind] ? it.kind : "improve"; counts[k] = (counts[k] || 0) + 1; });
        var tags = ["fix", "improve", "new"].filter(function (k) { return counts[k]; })
          .map(function (k) { return '<span class="tag ' + k + '">' + KIND_LABEL[k] + " " + counts[k] + '</span>'; }).join("");
        return '<a class="entry" href="./news-item.html?id=' + encodeURIComponent(u.id) + '">' +
          '<span class="date">' + fmtDate(u.date) + '</span>' +
          '<span class="entry-main">' +
            '<h2 class="entry-title maru">' + esc(u.title) + '</h2>' +
            (u.lead ? '<p class="entry-lead">' + esc(u.lead) + '</p>' : "") +
            (tags ? '<span class="entry-tags">' + tags + '</span>' : "") +
          '</span>' +
          '<span class="entry-meta">' + items.length + '件<span class="arrow" aria-hidden="true">›</span></span>' +
        '</a>';
      }).join("");
    })();
  </script>
</body>
</html>
